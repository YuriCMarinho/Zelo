[project]
name = "smartrepair-backend"
version = "0.1.0"
description = "SmartRepair AI Backend - Agentes de IA para Gestão de Imóveis de Temporada"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "apscheduler>=3.11.0,<4.0.0",
    "httpx>=0.28.0",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langfuse>=2.50.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx2>=2.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
explicit_package_bases = true
mypy_path = "."

[tool.pytest.ini_options]
testpaths = ["../tests", "tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=70 -W ignore::DeprecationWarning"
markers = [
    "real_llm: marca testes que efetuam chamadas reais pagas à API Featherless (executados apenas com -m real_llm)",
]
