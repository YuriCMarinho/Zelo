services:
  db:
    image: postgres:16-alpine
    container_name: smartrepair-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartrepair
    ports:
      # Porta 5433 no host: evita conflito com Postgres instalado localmente (5432)
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartrepair"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
