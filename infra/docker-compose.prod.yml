services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: smartrepair-unified-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: ../.env
        required: false
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/smartrepair
      - ENVIRONMENT=production
      - PORT=8000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: smartrepair-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartrepair
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartrepair"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_prod_data:
