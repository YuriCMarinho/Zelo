services:
  - type: web
    name: zelo-smartrepair-ai
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LLM_MODE
        value: recorded_demo
      - key: DATABASE_URL
        fromDatabase:
          name: zelo-postgres
          property: connectionString
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false

databases:
  - name: zelo-postgres
    plan: free
    region: oregon
